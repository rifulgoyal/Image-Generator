<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPulse</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    <header id="header">
        <h1 id="h1">Image Generator</h1><br>

        <form id="search-form">
            <label for="search">Search</label>
            <input id="search" type="search" required placeholder="Enter any text">
            <button id="Search" >Generate</button>
            <button type="reset" >Clear</button>
        </form>
        <p id="comment">Search any Keyword </p><br>
    </header>
    <main>
        <p id="status"></p>
        <section id="results">
            <p id="count" style="color: grey;">Showing "10" results</p>
            <p class="results-placeholder">Your generated results will appear here.</p>
        </section>

    </main>


    <button id="Theme" >🌙</button>
    <script src="script.js" ></script>
</body>
</html>
